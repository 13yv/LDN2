<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>倫敦旅遊 App 2026</title>
<style>
  :root{
    --navy:#0A1F44;
    --navy-2:#132A54;
    --crimson:#B22234;
    --white:#FFFFFF;
    --cream:#F6F2E7;
    --ink:#1C1B17;
    --line:#DCD2B8;
    --gold:#A9812E;
    --gold-soft:#EFE3C2;
    --text-soft:#6B6455;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC",sans-serif;
    padding-bottom:78px;
    -webkit-tap-highlight-color:transparent;
  }

  /* ============ 英倫風橫幅 Banner ============ */
  .banner{
    position:relative;
    background:var(--navy);
    overflow:hidden;
    border-radius:0 0 22px 22px;
    padding-bottom:26px;
    border-bottom:3px solid var(--gold);
  }
  .banner svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .banner-content{
    position:relative;
    z-index:3;
    padding:24px 18px 8px;
    text-align:center;
    color:var(--white);
  }
  .banner-content .kicker{
    display:inline-block;
    color:var(--gold-soft);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:3px;
    padding:3px 0;
    text-transform:uppercase;
    margin-bottom:6px;
    border-top:1px solid var(--gold);
    border-bottom:1px solid var(--gold);
    padding:5px 14px;
  }
  .banner-content h1{
    margin:10px 0 0;
    font-family:Georgia,"Noto Serif TC",serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--white);
  }
  .banner-content .sub{
    margin-top:8px;
    font-size:12px;
    font-weight:500;
    color:#C7CEE0;
    letter-spacing:0.5px;
  }
  .settings-btn{
    position:absolute;
    top:14px;
    right:14px;
    z-index:5;
    width:32px;height:32px;
    border-radius:50%;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold-soft);
    font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }

  /* ============ Tab bar(重疊圓角) ============ */
  .tabbar-wrap{
    margin-top:-18px;
    position:relative;
    z-index:6;
    background:var(--cream);
    border-radius:16px 16px 0 0;
    box-shadow:0 -4px 12px rgba(10,31,68,0.12);
    padding-top:8px;
  }
  nav.maintabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:8px 10px 10px;
  }
  nav.maintabs button{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--navy);
    padding:7px 12px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }
  nav.maintabs button .micon{font-size:16px;}
  nav.maintabs button.active{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--white);
  }

  nav.subtabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:0 12px 10px;
  }
  nav.subtabs button{
    flex:0 0 auto;
    border:1px solid var(--gold);
    background:var(--white);
    color:var(--gold);
    padding:6px 12px;
    border-radius:16px;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
  }
  nav.subtabs button.active{
    background:var(--gold);
    color:var(--white);
  }

  .progress-row{
    display:flex;
    gap:8px;
    padding:0 14px 10px;
    overflow-x:auto;
  }
  .progress-pill{
    flex:0 0 auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
    padding:5px 12px;
    font-size:11.5px;
    color:var(--navy);
    font-weight:700;
    white-space:nowrap;
  }
  .progress-pill b{color:var(--crimson);}

  .day-pills{
    display:flex;
    gap:6px;
    padding:0 12px 10px;
    overflow-x:auto;
  }
  .day-pill{
    flex:0 0 auto;
    padding:7px 11px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--white);
    text-align:center;
    min-width:50px;
  }
  .day-pill .dnum{font-size:10.5px;font-weight:700;color:var(--text-soft);}
  .day-pill .ddate{font-size:12px;font-weight:800;color:var(--navy);}
  .day-pill.active{background:var(--navy);border-color:var(--navy);}
  .day-pill.active .dnum{color:#B9C2E8;}
  .day-pill.active .ddate{color:var(--white);}
  .day-pill.tripday{border-color:var(--crimson);}
  .day-pill.tripday .dnum{color:var(--crimson);}

  .filter-row{
    display:flex;
    gap:6px;
    padding:0 14px 10px;
    flex-wrap:wrap;
  }
  .filter-chip{
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--navy);
  }
  .filter-chip.active{
    background:var(--crimson);
    color:var(--white);
    border-color:var(--crimson);
  }

  main{padding:6px 0 20px;}
  .section-hint{
    font-size:12px;
    color:var(--text-soft);
    padding:4px 16px 8px;
  }
  .empty-state{
    margin:20px 16px;
    padding:26px 16px;
    text-align:center;
    background:var(--white);
    border:1px dashed var(--gold);
    border-radius:10px;
    color:var(--text-soft);
    font-size:13px;
  }

  .day-header{padding:12px 16px 4px;}
  .day-header .dtitle{
    font-family:Georgia,"Noto Serif TC",serif;
    font-size:19px;
    font-weight:700;
    color:var(--navy);
  }
  .day-header .dsub{
    font-size:12.5px;
    color:var(--text-soft);
    margin-top:2px;
  }
  .daytrip-banner{
    margin:0 16px 10px;
    padding:10px 12px;
    background:#FBEAEA;
    border:1px solid var(--crimson);
    border-radius:8px;
    font-size:12.5px;
    color:var(--crimson);
    font-weight:600;
  }
  .daytrip-banner.info{
    background:var(--gold-soft);
    border-color:var(--gold);
    color:#6b4f0f;
  }

  /* ============ 單筆資料附加照片 ============ */
  .photo-attach-row{
    padding:0 12px 12px 46px;
  }
  .photo-attach-row.flush{
    padding:0;
    margin-top:8px;
  }
  .abtn.photoadd{
    border-color:var(--gold);
    color:#6b4f0f;
  }
  .photo-grid{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
  }
  .photo-thumb{
    flex:0 0 auto;
    width:60px;height:60px;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
    position:relative;
  }
  .photo-thumb img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-viewer-img{
    width:100%;
    border-radius:8px;
    margin-bottom:14px;
  }

  /* ============ 卡片(共用) ============ */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin:0 14px 12px;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(10,31,68,0.08);
  }
  .card.done{opacity:0.5;}
  .card-head{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 12px;
  }
  .badge{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    margin-top:1px;
  }
  .badge.must{background:var(--crimson);color:#fff;}
  .badge.nice{background:var(--gold);color:#fff;}
  .badge.chill{background:var(--navy);color:#fff;}
  .daytag{
    flex:0 0 auto;
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:8px;
    background:var(--navy);
    color:#fff;
    margin-top:2px;
    white-space:nowrap;
  }
  .daytag.off{background:#E4DCC8;color:#7a6f4d;}
  .card-title{flex:1;min-width:0;}
  .card-title .name{font-weight:700;font-size:15px;line-height:1.35;color:var(--ink);}
  .card-title .sub{font-size:12px;color:var(--text-soft);margin-top:2px;}
  .checkbox{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:5px;
    border:1.5px solid var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:transparent;
    margin-top:1px;
  }
  .checkbox.checked{background:var(--navy);color:#fff;}
  .card-body{
    display:none;
    padding:0 12px 12px 46px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink);
    border-top:1px dashed var(--line);
  }
  .card-body.open{display:block;padding-top:10px;}
  .card-body .row{margin-bottom:7px;}
  .card-body .label{font-weight:700;color:var(--navy);margin-right:4px;}
  .card-body .tip{
    background:var(--gold-soft);
    border-left:3px solid var(--gold);
    padding:8px 10px;
    margin-top:8px;
    border-radius:0 6px 6px 0;
    font-size:12.5px;
  }
  .card-actions{
    display:flex;
    gap:8px;
    padding:10px 12px 12px 46px;
    flex-wrap:wrap;
  }
  .abtn{
    font-size:12px;
    font-weight:700;
    padding:6px 11px;
    border-radius:7px;
    border:1px solid var(--navy);
    background:var(--white);
    color:var(--navy);
    text-decoration:none;
  }
  .abtn.maps{border-color:#1a7a3c;color:#1a7a3c;}
  .abtn.del{border-color:var(--crimson);color:var(--crimson);}

  /* ============ 每日行程時間軸 ============ */
  .timeline{padding:6px 16px 20px;}
  .titem{display:flex;gap:10px;margin-bottom:2px;}
  .titem .tline{flex:0 0 auto;width:24px;display:flex;flex-direction:column;align-items:center;}
  .titem .ticon{
    width:24px;height:24px;border-radius:50%;
    background:var(--white);border:1.5px solid var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;flex:0 0 auto;
  }
  .titem.done .ticon{background:var(--navy);}
  .titem .tbar{flex:1;width:1.5px;background:var(--line);margin:2px 0;min-height:14px;}
  .titem:last-child .tbar{display:none;}
  .titem .tbody{flex:1;min-width:0;padding-bottom:16px;}
  .titem .ttime{font-size:11.5px;font-weight:700;color:var(--crimson);margin-bottom:2px;}
  .titem .tcard{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;box-shadow:0 1px 4px rgba(10,31,68,0.08);
  }
  .titem.done .tcard{opacity:0.55;}
  .titem .ttitle-row{display:flex;align-items:flex-start;gap:8px;}
  .titem .ttitle{font-weight:700;font-size:14.5px;flex:1;line-height:1.4;color:var(--ink);}
  .titem .tcheck{
    flex:0 0 auto;width:20px;height:20px;border-radius:5px;
    border:1.5px solid var(--navy);display:flex;align-items:center;justify-content:center;
    font-size:12px;color:transparent;
  }
  .titem .tcheck.checked{background:var(--navy);color:#fff;}
  .titem .tdesc{font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.6;}
  .titem .ttransit{
    font-size:12px;color:var(--navy);margin-top:6px;padding:7px 9px;
    background:#EEF1F8;border-left:3px solid var(--navy);border-radius:0 6px 6px 0;line-height:1.6;
  }
  .titem .ttransit b{color:var(--crimson);}
  .titem .tactions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}

  /* ============ 必看清單子勾選 ============ */
  .hlwrap{
    margin-top:8px;
    padding:8px 10px;
    background:var(--gold-soft);
    border-radius:8px;
    border:1px solid var(--gold);
  }
  .hltitle{
    font-size:11.5px;
    font-weight:800;
    color:#6b4f0f;
    margin-bottom:6px;
  }
  .hlitem{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:4px 0;
  }
  .hlitem.done .hltext{opacity:0.5;text-decoration:line-through;}
  .hlcheck{
    flex:0 0 auto;
    width:17px;height:17px;
    margin-top:1px;
    border-radius:4px;
    border:1.5px solid var(--gold);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;
    color:transparent;
  }
  .hlcheck.checked{background:var(--gold);color:#fff;}
  .hltext{
    font-size:12.5px;
    color:var(--ink);
    line-height:1.5;
  }

  /* ============ 懸浮新增按鈕 ============ */
  .fab{
    position:fixed;
    right:18px;
    bottom:22px;
    width:54px;height:54px;
    border-radius:50%;
    background:var(--crimson);
    border:2px solid var(--white);
    color:#fff;
    font-size:24px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
    z-index:30;
  }

  /* ============ Modal ============ */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(10,31,68,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--cream);
    width:100%;
    max-width:520px;
    max-height:86vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    border:1px solid var(--navy);
    border-bottom:none;
    padding:18px 18px 24px;
  }
  .modal-box h2{
    margin:0 0 14px;
    font-family:Georgia,"Noto Serif TC",serif;
    font-size:17px;
    font-weight:700;
    color:var(--navy);
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:4px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    border:1px solid var(--navy);
    border-radius:7px;
    padding:8px 10px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{min-height:60px;resize:vertical;}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .mbtn{
    flex:1;
    padding:11px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    border:1px solid var(--navy);
    background:#fff;
    color:var(--navy);
  }
  .mbtn.primary{background:var(--navy);color:#fff;}
  .mbtn.danger{background:var(--crimson);border-color:var(--crimson);color:#fff;}
  .mbtn.ghost{background:transparent;}

  .settings-list{display:flex;flex-direction:column;gap:10px;}
  .settings-list button{
    width:100%;
    text-align:left;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-size:14px;
    font-weight:700;
  }
  .settings-list button.danger{border-color:var(--crimson);color:var(--crimson);}
  .io-textarea{
    width:100%;
    min-height:160px;
    border:1px solid var(--navy);
    border-radius:7px;
    padding:8px 10px;
    font-size:12px;
    font-family:monospace;
    margin-top:8px;
  }
  .toast{
    position:fixed;
    top:16px;left:50%;
    transform:translateX(-50%);
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    border-radius:16px;
    font-size:13px;
    font-weight:700;
    z-index:80;
    box-shadow:0 3px 10px rgba(0,0,0,0.3);
    display:none;
  }
  .toast.show{display:block;}

  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="banner">
  <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="200" fill="#0A1F44"/>
    <g stroke="#FFFFFF" stroke-width="10" opacity="0.10">
      <line x1="-50" y1="0" x2="450" y2="200"/>
      <line x1="450" y1="0" x2="-50" y2="200"/>
    </g>
    <g stroke="#B22234" stroke-width="4" opacity="0.35">
      <line x1="-50" y1="0" x2="450" y2="200"/>
      <line x1="450" y1="0" x2="-50" y2="200"/>
    </g>
    <line x1="200" y1="0" x2="200" y2="200" stroke="#FFFFFF" stroke-width="8" opacity="0.08"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#FFFFFF" stroke-width="8" opacity="0.08"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke="#B22234" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#B22234" stroke-width="3" opacity="0.3"/>
    <circle cx="200" cy="100" r="46" fill="none" stroke="#A9812E" stroke-width="1.5" opacity="0.55"/>
    <circle cx="200" cy="100" r="40" fill="none" stroke="#A9812E" stroke-width="1" opacity="0.4"/>
  </svg>
  <button class="settings-btn" id="settingsBtn">⚙️</button>
  <div class="banner-content">
    <span class="kicker">A London Journey</span>
    <h1>London 2026</h1>
    <div class="sub">10.6 — 10.20 ・ Aparthotel Adagio London City East</div>
  </div>
</div>

<div class="tabbar-wrap">
  <nav class="maintabs" id="maintabs"></nav>
  <nav class="subtabs hidden" id="subtabs"></nav>
  <div class="day-pills hidden" id="dayPills"></div>
  <div class="progress-row" id="progressRow"></div>
  <div class="filter-row" id="filterRow"></div>
</div>

<main id="listArea"></main>

<button class="fab" id="fabAdd">＋</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="photoFileInput" accept="image/*" multiple capture="environment" style="display:none;">

<script>
/* =========================================================
   工具函式
   ========================================================= */
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s); }
function mapsUrl(q){
  if(!q) return '';
  let query = q;
  if(!/london|cambridge|oxford|chichester|goodwood/i.test(query)) query = query + ' London';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>{ t.classList.remove('show'); }, 1800);
}

/* =========================================================
   預設資料 DEFAULT_DATA
   ========================================================= */
const DEFAULT_DATA = {
  itinerary: [
{ day:1, date:"10/6", weekday:"二", title:"出發日", tripday:false, note:"", items:[

  {time:"05:45", icon:"🅿️", title:"抵達日月亭停車場", desc:"", transit:""},
  {time:"06:00", icon:"🛫", title:"抵達桃園機場第一航廈", desc:"", transit:""},
  {time:"08:20", icon:"✈️", title:"桃園機場 T1 起飛 CI081", desc:"", transit:""},
  {time:"16:30", icon:"✈️", title:"抵達倫敦(當地時間)", desc:"Heathrow Terminal 3", transit:""},
  {time:"16:30", icon:"🛂", title:"入境審查 + 提領行李", desc:"抓2小時緩衝時間,實際依現場排隊狀況調整", transit:""},
  {time:"18:30", icon:"🚇", title:"搭乘 Elizabeth Line 前往 Whitechapel 站", desc:"不需事先買票,直接用感應信用卡、Apple Pay/Google Pay 或 Oyster卡感應搭乘即可,票價約£15.50,每日上限£16.30", transit:"Heathrow T3站(Elizabeth Line)直達 Whitechapel站,車程約48-50分鐘,中途不用轉車"},

const STORAGE_KEY = 'london2026_appdata_v17';

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function ensureIds(app){
  function walk(arr){
    if(!Array.isArray(arr)) return;
    arr.forEach(it=>{
      if(!it.id) it.id = uid();
      if(it.done===undefined) it.done = false;
    });
  }
  if(!Array.isArray(app.adhoc)) app.adhoc = [];
  walk(app.luggage); walk(app.prep); walk(app.inflight);
  walk(app.flights); walk(app.accommodation);
  walk(app.museum); walk(app.market); walk(app.food); walk(app.adhoc);
  if(Array.isArray(app.itinerary)){
    app.itinerary.forEach(d=>{
      if(!d.id) d.id = uid();
      walk(d.items);
    });
  }
  return app;
}

function loadApp(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      return ensureIds(JSON.parse(raw));
    }
  }catch(e){}
  const fresh = ensureIds(deepClone(DEFAULT_DATA));
  saveApp(fresh);
  return fresh;
}
function saveApp(app){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(app)); }catch(e){}
}

/* =========================================================

function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});

function getListRef(listKey, dayIndex){
  if(listKey==='itinerary'){
    const d = APP.itinerary.find(x=>x.day===dayIndex);
    return d ? d.items : null;
  }
  return APP[listKey];
}

function openItemForm(listKey, itemId, dayIndex){
  const meta = LIST_META[listKey];
  const arr = getListRef(listKey, dayIndex);
  const item = itemId ? arr.find(x=>x.id===itemId) : null;

  let dayPicker = '';
  if(listKey==='itinerary'){
    let opts = '';
    for(let i=1;i<=15;i++){
      opts += '<option value="'+i+'"'+(i===(dayIndex||activeDay)?' selected':'')+'>Day'+i+'</option>';
    }
    dayPicker = '<div class="field"><label>屬於第幾天</label><select id="f_day">'+opts+'</select></div>';
  }

  let fieldsHtml = dayPicker;
  meta.schema.forEach(f=>{
    const val = item ? esc(item[f.k]) : '';
    if(f.type==='textarea'){
      fieldsHtml += '<div class="field"><label>'+f.label+'</label><textarea id="f_'+f.k+'">'+val+'</textarea></div>';
    } else {
      fieldsHtml += '<div class="field"><label>'+f.label+'</label><input id="f_'+f.k+'" type="text" value="'+val.replace(/"/g,'&quot;')+'"></div>';
    }
  });

  const title = item ? '編輯項目' : '新增項目';
  let html = '<h2>'+title+'</h2>' + fieldsHtml +
    '<div class="modal-actions">' +
    '<button class="mbtn ghost" id="btnCancel">取消</button>' +
    (item ? '<button class="mbtn danger" id="btnDelete">刪除</button>' : '') +
    '<button class="mbtn primary" id="btnSave">儲存</button>' +
    '</div>';
  openModal(html);

  document.getElementById('btnCancel').onclick = closeModal;
  if(item){
    document.getElementById('btnDelete').onclick = function(){
      if(confirm('確定要刪除這個項目嗎?此動作無法復原。')){
        const targetArr = listKey==='itinerary' ? getListRef('itinerary', dayIndex) : APP[listKey];
        const idx = targetArr.findIndex(x=>x.id===itemId);
        if(idx>-1) targetArr.splice(idx,1);
        saveApp(APP);
        closeModal();
        renderAll();
        showToast('已刪除');
      }
    };
  }
  document.getElementById('btnSave').onclick = function(){
    let targetArr;
    if(listKey==='itinerary'){
      const newDay = parseInt(document.getElementById('f_day').value, 10);
      targetArr = getListRef('itinerary', newDay);
      if(item){
        const oldArr = getListRef('itinerary', dayIndex);
        const idx = oldArr.findIndex(x=>x.id===itemId);
        if(idx>-1) oldArr.splice(idx,1);
      }
    } else {
      targetArr = APP[listKey];
    }

    const data = item ? Object.assign({}, item) : { id: uid(), done:false };
    meta.schema.forEach(f=>{
      const el = document.getElementById('f_'+f.k);
      let v = el ? el.value : '';
      if(f.k==='scheduledDay'){
        v = v.trim()==='' ? null : parseInt(v,10);
      }
      data[f.k] = v;
    });

    const titleVal = data[meta.titleKey];
    if(!titleVal || !String(titleVal).trim()){
      alert('請至少填寫名稱/標題');
      return;
    }

    if(item){
      targetArr.push(data);
    } else {
      targetArr.push(data);
    }
    saveApp(APP);
    if(listKey==='itinerary') activeDay = parseInt(document.getElementById('f_day').value,10);
    closeModal();
    renderAll();
    showToast('已儲存');
  };
}

      const ta = document.getElementById('exportArea');
      ta.select();
      ta.setSelectionRange(0, 999999);
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(ta.value);

      '<button class="mbtn primary" id="btnDoImport">確認匯入</button>' +
      '</div>';
    openModal(h);
    document.getElementById('btnCloseImport').onclick = closeModal;
    document.getElementById('btnDoImport').onclick = function(){
      const txt = document.getElementById('importArea').value.trim();
      try{
        const parsed = JSON.parse(txt);
        APP = ensureIds(parsed);
        saveApp(APP);
        closeModal();
        renderAll();
        showToast('匯入成功');
      }catch(e){
        alert('這段文字看起來不是有效的資料格式,請確認複製完整。');
      }
    };
  };
};

let pendingPhotoItem = null;

function ensurePhotos(item){
  if(!Array.isArray(item.photos)) item.photos = [];
  return item.photos;
}

function renderPhotoAttachRow(item, noIndent){
  const wrap = document.createElement('div');
  wrap.className = noIndent ? 'photo-attach-row flush' : 'photo-attach-row';
  const photos = ensurePhotos(item);

  if(photos.length){
    const grid = document.createElement('div');
    grid.className = 'photo-grid';
    photos.forEach((src, idx)=>{
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      const img = document.createElement('img');
      img.src = src;
      img.onclick = (e)=>{ e.stopPropagation(); openItemPhotoViewer(item, idx); };
      thumb.appendChild(img);
      grid.appendChild(thumb);
    });
    wrap.appendChild(grid);
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'abtn photoadd';
  addBtn.textContent = photos.length ? '📎 再附加一張' : '📎 附加截圖/照片';
  addBtn.onclick = (e)=>{
    e.stopPropagation();
    pendingPhotoItem = item;
    document.getElementById('photoFileInput').click();
  };
  wrap.appendChild(addBtn);

  return wrap;
}

function openItemPhotoViewer(item, idx){
  const photos = ensurePhotos(item);
  if(!photos[idx]) return;
  const html = '<h2>照片</h2>' +
    '<img class="photo-viewer-img" src="'+photos[idx]+'">' +
    '<div class="modal-actions">' +
    '<button class="mbtn ghost" id="btnClosePhoto">關閉</button>' +
    '<button class="mbtn danger" id="btnDeletePhoto">刪除這張</button>' +
    '</div>';
  openModal(html);
  document.getElementById('btnClosePhoto').onclick = closeModal;
  document.getElementById('btnDeletePhoto').onclick = ()=>{
    if(confirm('確定要刪除這張照片嗎?')){
      photos.splice(idx,1);
      saveApp(APP);
      closeModal();
      renderAll();
      showToast('已刪除照片');
    }
  };
}

function compressImageFile(file, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxSide = 1200;
      let w = img.width, h = img.height;
      if(w > h && w > maxSide){ h = Math.round(h * maxSide / w); w = maxSide; }
      else if(h >= w && h > maxSide){ w = Math.round(w * maxSide / h); h = maxSide; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      callback(dataUrl);
    };
    img.onerror = function(){ callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

document.getElementById('photoFileInput').addEventListener('change', function(e){
  const files = Array.from(e.target.files || []);
  if(!files.length || !pendingPhotoItem) return;
  const item = pendingPhotoItem;
  const photos = ensurePhotos(item);
  let remaining = files.length;
  let failedQuota = false;
  files.forEach(file=>{
    compressImageFile(file, dataUrl=>{
      remaining--;
      if(dataUrl){
        try{
          photos.push(dataUrl);
          saveApp(APP);
        }catch(err){
          failedQuota = true;
          const idx = photos.indexOf(dataUrl);
          if(idx>-1) photos.splice(idx,1);
        }
      }
      if(remaining===0){
        e.target.value = '';
        pendingPhotoItem = null;
        renderAll();
        if(failedQuota){
          alert('手機儲存空間不夠了,這張(或這幾張)照片沒有存成功。建議先刪除幾張舊照片,或用「設定→匯出資料」備份後清一些空間。');
        } else {
          showToast('截圖已附加');
        }
      }
    });
  });
});

    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';
    let rows = '';
    if(item.open) rows += '<div class="row"><span class="label">營業日</span>'+esc(item.open)+'</div>';
    if(item.best) rows += '<div class="row"><span class="label">推薦時段</span>'+esc(item.best)+'</div>';
    if(item.tip) rows += '<div class="tip">'+esc(item.tip)+'</div>';
    body.innerHTML = rows || '<div class="row" style="color:var(--text-soft)">尚無更多資訊</div>';
    card.appendChild(body);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const mapA = document.createElement('a');
    mapA.className = 'abtn maps';
    mapA.href = mapsUrl(item.name);
    mapA.target = '_blank';
    mapA.rel = 'noopener';
    mapA.textContent = '📍 導航';
    actions.appendChild(mapA);

    const editBtn = document.createElement('button');
    editBtn.className = 'abtn';
    editBtn.textContent = '✏️ 編輯';
    editBtn.onclick = ()=>{ openItemForm('market', item.id); };
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'abtn del';
    delBtn.textContent = '🗑️ 刪除';
    delBtn.onclick = ()=>{
      if(confirm('確定要刪除「'+item.name+'」嗎?')){
        const idx = APP.market.indexOf(item);
        if(idx>-1) APP.market.splice(idx,1);
        saveApp(APP);
        renderAll();
        showToast('已刪除');
      }
    };
    actions.appendChild(delBtn);

    card.appendChild(actions);
    card.appendChild(renderPhotoAttachRow(item));
    el.appendChild(card);
  });
}

function renderFoodFilters(){
  const el = document.getElementById('filterRow');
  el.innerHTML = '';
  const days = [];
  APP.food.forEach(it=>{
    if(it.scheduledDay!==null && it.scheduledDay!==undefined && it.scheduledDay!=='' && days.indexOf(it.scheduledDay)===-1) days.push(it.scheduledDay);
  });
  days.sort((a,b)=>a-b);
  const opts = [{k:'all', label:'全部'}].concat(days.map(d=>({k:'day'+d, label:'Day'+d})));
  opts.forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (foodAreaFilter===o.k?' active':'');
    chip.textContent = o.label;
    chip.onclick = ()=>{ foodAreaFilter = o.k; renderList(); };
    el.appendChild(chip);
  });
}

function renderFoodList(){
  const el = document.getElementById('listArea');
  el.innerHTML = '';
  const hint = document.createElement('div');
  hint.className = 'section-hint';
  hint.textContent = '這12家是那幾天「午餐/晚餐隨意」時順路可以考慮的店,依天數排列,點上面的Day篩選只看那天的選項。';
  el.appendChild(hint);

  const items = APP.food.slice().sort((a,b)=>{
    const av = (a.scheduledDay===null||a.scheduledDay===undefined||a.scheduledDay==='') ? 999 : a.scheduledDay;
    const bv = (b.scheduledDay===null||b.scheduledDay===undefined||b.scheduledDay==='') ? 999 : b.scheduledDay;
    return av - bv;
  });

  items.forEach(item=>{
    const scheduled = item.scheduledDay!==null && item.scheduledDay!==undefined && item.scheduledDay!=='';
    if(foodAreaFilter!=='all' && foodAreaFilter!==('day'+item.scheduledDay)) return;

    const isDone = !!item.done;
    const card = document.createElement('div');
    card.className = 'card' + (isDone?' done':'');

    const head = document.createElement('div');
    head.className = 'card-head';

    const dtag = document.createElement('div');
    dtag.className = 'daytag' + (scheduled ? '' : ' off');
    dtag.textContent = scheduled ? ('Day'+item.scheduledDay+'可選') : '其他店家';
    head.appendChild(dtag);

    const titleWrap = document.createElement('div');
    titleWrap.className = 'card-title';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = item.name;
    titleWrap.appendChild(nameEl);
    const subEl = document.createElement('div');
    subEl.className = 'sub';
    subEl.textContent = item.station || item.type || '';
    titleWrap.appendChild(subEl);
    titleWrap.onclick = ()=>{ card.querySelector('.card-body').classList.toggle('open'); };
    head.appendChild(titleWrap);

    const cb = document.createElement('div');
    cb.className = 'checkbox' + (isDone?' checked':'');
    cb.textContent = isDone ? '✓' : '';
    cb.onclick = (e)=>{ e.stopPropagation(); item.done = !item.done; saveApp(APP); renderAll(); };
    head.appendChild(cb);

    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';
    let rows = '';
    if(item.area) rows += '<div class="row"><span class="label">區域</span>'+esc(item.area)+'</div>';
    if(item.station) rows += '<div class="row"><span class="label">地鐵站</span>'+esc(item.station)+'</div>';
    if(item.type) rows += '<div class="row"><span class="label">類型</span>'+esc(item.type)+(item.price?'　'+esc(item.price):'')+'</div>';
    if(item.tip) rows += '<div class="tip">'+esc(item.tip)+'</div>';
    body.innerHTML = rows || '<div class="row" style="color:var(--text-soft)">尚無更多資訊</div>';
    card.appendChild(body);

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const q = (item.station ? item.name+' '+item.station : item.name);
    const mapA = document.createElement('a');
    mapA.className = 'abtn maps';
    mapA.href = mapsUrl(q);
    mapA.target = '_blank';
    mapA.rel = 'noopener';
    mapA.textContent = '📍 導航';
    actions.appendChild(mapA);

    const editBtn = document.createElement('button');
    editBtn.className = 'abtn';
    editBtn.textContent = '✏️ 編輯';
    editBtn.onclick = ()=>{ openItemForm('food', item.id); };
    actions.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'abtn del';
    delBtn.textContent = '🗑️ 刪除';
    delBtn.onclick = ()=>{
      if(confirm('確定要刪除「'+item.name+'」嗎?')){
        const idx = APP.food.indexOf(item);
        if(idx>-1) APP.food.splice(idx,1);
        saveApp(APP);
        renderAll();
        showToast('已刪除');
      }
    };
    actions.appendChild(delBtn);

    card.appendChild(actions);
    card.appendChild(renderPhotoAttachRow(item));
    el.appendChild(card);
  });
}

/* =========================================================
   進度條(依分頁)
   ========================================================= */
function renderProgress(){
  const el = document.getElementById('progressRow');
  el.innerHTML = '';
  if(mainTab==='itinerary'){
    renderItineraryProgress(el);
  } else if(mainTab==='prep'){
    const key = subTab.prep;
    const arr = APP[key];
    const done = arr.filter(x=>x.done).length;
    const pill = document.createElement('div');
    pill.className = 'progress-pill';
    pill.innerHTML = '進度 <b>'+done+'/'+arr.length+'</b>';
    el.appendChild(pill);
  } else if(mainTab==='museum'){
    const done = APP.museum.filter(x=>x.done).length;
    const pill = document.createElement('div');
    pill.className = 'progress-pill';
    pill.innerHTML = '已去過 <b>'+done+'/'+APP.museum.length+'</b>';
    el.appendChild(pill);
  } else if(mainTab==='market'){
    const key = subTab.market;
    const arr = APP[key];
    const done = arr.filter(x=>x.done).length;
    const pill = document.createElement('div');
    pill.className = 'progress-pill';
    pill.innerHTML = '已去過 <b>'+done+'/'+arr.length+'</b>';
    el.appendChild(pill);
  } else if(mainTab==='adhoc'){
    const done = APP.adhoc.filter(x=>x.done).length;
    const pill = document.createElement('div');
    pill.className = 'progress-pill';
    pill.innerHTML = '已完成 <b>'+done+'/'+APP.adhoc.length+'</b>';
    el.appendChild(pill);
  }
}

/* =========================================================
   總控 render
   ========================================================= */
function renderList(){
  document.getElementById('filterRow').innerHTML = '';
  if(mainTab==='itinerary'){
    renderItineraryList();
  } else if(mainTab==='prep'){
    renderSimpleList(subTab.prep);
  } else if(mainTab==='logistics'){
    renderSimpleList(subTab.logistics);
  } else if(mainTab==='museum'){
    renderMuseumFilters();
    renderMuseumList();
  } else if(mainTab==='market'){
    if(subTab.market==='market'){
      renderMarketFilters();
      renderMarketList();
    } else {
      renderFoodFilters();
      renderFoodList();
    }
  } else if(mainTab==='adhoc'){
    renderSimpleList('adhoc');
  }
}

function renderAll(){
  renderMainTabs();
  renderSubTabs();
  renderDayPills();
  renderProgress();
  renderList();
}

renderAll();

</script>
